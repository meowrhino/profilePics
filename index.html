<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>pfp's</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Archivo completo de mis fotos de perfil de Telegram, de la más antigua a la más reciente." />
  <link rel="canonical" href="https://profile.meowrhino.studio/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="pfp's" />
  <meta property="og:description" content="Archivo completo de mis fotos de perfil de Telegram, de la más antigua a la más reciente." />
  <meta property="og:url" content="https://profile.meowrhino.studio/" />
  <meta property="og:image" content="https://profile.meowrhino.studio/favicon/android-chrome-512x512.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="icon" href="favicon/favicon.ico">
  <link rel="preload" href="fonts/agdasima-700.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Agdasima (OFL), solo latin, servida desde aquí: Google Fonts bloqueaba
       la página entera con poca red. */
    @font-face {
      font-family: "Agdasima";
      font-weight: 400;
      font-display: swap;
      src: url("fonts/agdasima-400.woff2") format("woff2");
    }

    @font-face {
      font-family: "Agdasima";
      font-weight: 700;
      font-display: swap;
      src: url("fonts/agdasima-700.woff2") format("woff2");
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Agdasima", sans-serif;
      background-color: #1a1a1a;
      background-image:
        radial-gradient(ellipse at center, #1a1a1a 40%, transparent 70%),
        radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 22px 22px;
      overflow: hidden;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      background: #1a1a1a;
      color: #555;
      z-index: 10;
    }

    #loader span {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .gallery,
    #current-number,
    #arrow,
    #progress {
      visibility: hidden;
    }

    #current-number,
    #arrow {
      position: fixed;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 5em;
      font-weight: 700;
      color: #ffe600;
      pointer-events: none;
      text-shadow: 0 2px 24px rgba(255, 230, 0, 0.25);
    }

    #current-number {
      bottom: 10vh;
      transition: color 0.15s, text-shadow 0.15s;
    }

    /* Naranja = la foto señalada se está viendo en círculo. */
    #current-number.round {
      color: #ff9a1f;
      text-shadow: 0 2px 24px rgba(255, 154, 31, 0.35);
    }

    #current-number.error {
      color: #ff3333;
      text-shadow: 0 2px 24px rgba(255, 50, 50, 0.4);
    }

    #arrow {
      top: 10vh;
      opacity: 0.5;
    }

    .gallery {
      position: fixed;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100vw;
      height: 40vh;
      display: flex;
      gap: 10vw;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .gallery::-webkit-scrollbar {
      display: none;
    }

    /* Cuadrado a propósito: el border-radius:50% del hover sólo da un círculo
       si el tile es cuadrado. Si cambias estas medidas, mantenlas iguales. */
    .tile {
      flex: 0 0 auto;
      width: 40vh;
      height: 40vh;
      overflow: hidden;
      background: #2a2a2a;
      border-radius: 0;
      transition: border-radius 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.4s ease;
      cursor: pointer;
    }

    /* Círculo como en Telegram: con ratón al pasar por encima; en táctil al
       tocar la del centro (.is-round, lo pone gallery.js). El :hover va solo
       con puntero real: en táctil se queda pegado tras tocar. */
    .tile.is-round {
      border-radius: 50%;
      box-shadow: 0 0 34px rgba(255, 154, 31, 0.2);
    }

    @media (hover: hover) {
      .tile:hover {
        border-radius: 50%;
        box-shadow: 0 0 34px rgba(255, 154, 31, 0.2);
      }
    }

    /* Táctil: tocar el número abre el teclado numérico (ver #jump). */
    @media (hover: none) {
      #current-number {
        pointer-events: auto;
        left: 50%;
        width: auto;
        padding: 0 0.3em;
        transform: translateX(-50%);
      }

      #hint {
        display: none;
      }
    }

    /* Fuera de la vista pero enfocable; 16px para que iOS no haga zoom. */
    #jump {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      font-size: 16px;
      border: 0;
      padding: 0;
    }

    .tile img,
    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: inherit;   /* Safari dentaría el borde sin esto */
    }

    /* Aún sin cargar (gallery.js pone el src al acercarse): sin icono roto. */
    .tile img:not([src]) {
      visibility: hidden;
    }

    /* Chrome pinta un overlay de play/mute sobre vídeos pausados. */
    .tile video::-webkit-media-controls,
    .tile video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none;
    }

    .galleryMargin {
      flex: 0 0 auto;
    }

    #progress {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #ffe600, #ffb300);
      width: 0;
      transition: width 0.1s linear;
      opacity: 0.7;
      z-index: 5;
    }

    #hint {
      position: fixed;
      bottom: 3vh;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      color: #6a6a6a;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #hint.show {
      opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {

      .tile,
      #progress,
      #hint,
      #current-number {
        transition: none;
      }

      #loader span {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div id="loader"><span>Cargando…</span></div>
  <div id="arrow">⬇</div>
  <div id="current-number">0</div>
  <div class="gallery"></div>
  <div id="hint">escribe un número o una palabra · ← → para navegar</div>
  <div id="progress"></div>
  <input id="jump" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="go" autocomplete="off" aria-label="Ir a la foto número" tabindex="-1">

  <script src="js/text2num.js"></script><!-- optional: remove to disable text input -->
  <script src="js/gallery.js"></script>
</body>

</html>
